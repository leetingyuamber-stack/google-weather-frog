<!DOCTYPE html>
<html>
<head>
    <title>Froggy Tracker</title>
    <style>
        body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;background:#233342;font-family:sans-serif;transition:1s;}
        #box{position:absolute;top:20px;left:20px;background:#fff;padding:15px;border-radius:8px;}
        #frog{position:relative;width:200px;height:200px;animation:b 3s infinite ease-in-out;}
        .h{width:200px;height:140px;background:#A3D977;border-radius:50%;position:absolute;z-index:2;}
        .b{width:130px;height:90px;background:#A3D977;border-radius:50%;position:absolute;bottom:0;left:35px;z-index:1;}
        .e{width:50px;height:50px;background:#A3D977;border-radius:50%;position:absolute;top:-15px;}
        .l{left:25px;}.r{left:125px;}
        .p{width:20px;height:22px;background:#2C3E50;border-radius:50%;position:absolute;top:15px;left:15px;}
        .p.s{width:24px;height:5px;border-radius:3px;top:25px;left:13px;}
        .c{width:24px;height:12px;background:#FFB3BA;border-radius:50%;position:absolute;top:70px;}
        .cl{left:25px;}.cr{left:150px;}
        .m{width:40px;height:15px;border-bottom:5px solid #2C3E50;border-radius:0 0 20px 20px;position:absolute;top:65px;left:80px;}
        @keyframes b{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(4px) scale(1.02);}}
    </style>
</head>
<body>
    <div id="box"><h3 style="margin:0 0 5px 0;">Froggy's Schedule</h3><div id="txt">Syncing...</div></div>
    <div id="frog">
        <div class="h">
            <div class="e l"><div class="p" id="pl"></div></div>
            <div class="e r"><div class="p" id="pr"></div></div>
            <div class="c cl"></div><div class="c cr"></div>
            <div class="m"></div>
        </div>
        <div class="b"></div>
    </div>
    <script>
        function check(){
            const m = (new Date().getHours()*60)+new Date().getMinutes();
            let t="💤 Fast asleep...", s=true, bg="#233342";
            if(m>=360&&m<480){t="🌅 Waking up...";s=false;bg="#fff176";}
            else if(m>=480&&m<510){t="🍳 Breakfast time!";s=false;bg="#AED6F1";}
            else if(m>=510&&m<780){t="📚 Studying hard at school!";s=false;bg="#AED6F1";}
            else if(m>=780&&m<840){t="🥪 Lunch break!";s=false;bg="#AED6F1";}
            else if(m>=840&&m<900){t="🚌 Riding the bus home!";s=false;bg="#AED6F1";}
            else if(m>=900&&m<960){t="🐸 Free room time!";s=false;bg="#fff176";}
            else if(m>=960&&m<1110){t="✍️ Homework focus!";s=false;bg="#fff176";}
            else if(m>=1110&&m<1140){t="🍲 Dinner time!";s=false;bg="#233342";}
            else if(m>=1140&&m<1260){t="🎨 Drawing cute sketches!";s=false;bg="#233342";}
            document.body.style.background=bg;
            document.getElementById("txt").innerHTML=t;
            document.getElementById("pl").className=s?"p s":"p";
            document.getElementById("pr").className=s?"p s":"p";
        }
        check();setInterval(check,10000);
    </script>
</body>
</html>
