<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animated Weather Frog</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #frog-background {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1s ease-in-out;
        }
        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="info-box">
        <h3 style="margin: 0 0 5px 0;">Froggy's Room</h3>
        <div id="weather-status">Checking the clock...</div>
    </div>

    <div id="frog-background"></div>

    <script>
        // These moving GIFs are hosted on a reliable server that schools don't block
        const FROG_GIFS = {
            day: "https://giphy.com", // Sunny daytime frog
            night: "https://giphy.com" // Cozy nighttime frog
        };

        function updateFrogByTime() {
            // Get your laptop's current hour (0 to 23)
            const hour = new Date().getHours();
            let statusText = "";
            let timeOfDay = "day";

            // If it's between 6 PM (18) and 6 AM (6), show the cozy night frog!
            if (hour >= 18 || hour < 6) {
                timeOfDay = "night";
                statusText = "🌙 Cozy Night Mode Activated!";
            } else {
                timeOfDay = "day";
                statusText = "☀️ Bright Day Mode Activated!";
            }

            document.getElementById('weather-status').innerHTML = statusText;
            document.getElementById('frog-background').style.backgroundImage = `url('${FROG_GIFS[timeOfDay]}')`;
        }

        // Run instantly
        updateFrogByTime();
    </script>
</body>
</html>
