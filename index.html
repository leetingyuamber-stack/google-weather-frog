<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Safe Weather Frog</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #729b53; /* Cozy frog green background */
        }
        #frog-background {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="info-box">
        <h3 style="margin: 0 0 5px 0;">Froggy's School Corner</h3>
        <div id="weather-status">Checking your clock...</div>
    </div>

    <div id="frog-background"></div>

    <script>
        // These links come straight from Google, so school filters cannot block them!
        const FROG_IMAGES = {
            day: "https://gstatic.com", // Google Weather Icon
            night: "https://gstatic.com" // Google Night Icon
        };

        function updateFrogByTime() {
            const hour = new Date().getHours();
            let statusText = "";
            let timeOfDay = "day";

            // Past 6 PM (18:00), switch to night mode!
            if (hour >= 18 || hour < 6) {
                timeOfDay = "night";
                statusText = "🌙 It's past 8:50 PM in Bishan — Cozy Night Active!";
            } else {
                timeOfDay = "day";
                statusText = "☀️ School Daytime Mode Active!";
            }

            document.getElementById('weather-status').innerHTML = statusText;
            document.getElementById('frog-background').style.backgroundImage = `url('${FROG_IMAGES[timeOfDay]}')`;
        }

        updateFrogByTime();
    </script>
</body>
</html>
