<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animated Weather Frog</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 1s ease;
        }

        /* 1. ANIMATION FOR BOUNCING */
        @keyframes frogBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .frog-container {
            position: relative;
            width: 200px;
            height: 160px;
            animation: frogBounce 3s ease-in-out infinite;
        }

        /* 2. ANIMATION FOR BREATHING */
        @keyframes frogBreathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        .frog-body {
            width: 160px;
            height: 120px;
            background: #A3D977; /* Bright Frog Green */
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            left: 20px;
            box-shadow: inset -10px -10px 0px rgba(0,0,0,0.1);
            animation: frogBreathe 3s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .frog-eye {
            width: 45px;
            height: 45px;
            background: #A3D977;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            z-index: 2;
        }
        .frog-eye.left { left: 35px; }
        .frog-eye.right { right: 35px; }

        /* 3. ANIMATION FOR BLINKING */
        @keyframes frogBlink {
            0%, 95%, 100% { transform: scaleY(1); }
            97% { transform: scaleY(0.1); }
        }

        .pupil {
            width: 20px;
            height: 20px;
            background: #2C3E50;
            border-radius: 50%;
            position: absolute;
            top: 12px;
            left: 12px;
            animation: frogBlink 4s infinite;
            transform-origin: center;
        }

        .frog-blush {
            width: 20px;
            height: 10px;
            background: #FFA07A;
            border-radius: 50%;
            position: absolute;
            top: 75px;
        }
        .frog-blush.left { left: 40px; }
        .frog-blush.right { right: 40px; }

        .frog-smile {
            width: 40px;
            height: 20px;
            border-bottom: 4px solid #2C3E50;
            border-radius: 0 0 20px 20px;
            position: absolute;
            top: 70px;
            left: 60px;
        }

        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="info-box">
        <h3 style="margin: 0 0 5px 0; color: #2C3E50;">Froggy's Living Room</h3>
        <div id="weather-status">Reading the clock...</div>
    </div>

    <!-- Centered Moving Frog Body Parts -->
    <div class="frog-container">
        <div class="frog-eye left"><div class="pupil"></div></div>
        <div class="frog-eye right"><div class="pupil"></div></div>
        <div class="frog-body">
            <div class="frog-blush left"></div>
            <div class="frog-blush right"></div>
            <div class="frog-smile"></div>
        </div>
    </div>

    <script>
        function updateThemeByTime() {
            const hour = new Date().getHours();
            let statusText = "";

            if (hour >= 18 || hour < 6) {
                document.body.style.background = "#2C3E50"; // Midnight Cozy Dark Blue
                statusText = "🌙 Cozy Night Mode Activated!";
            } else {
                document.body.style.background = "#AED6F1"; // School Day Bright Blue
                statusText = "☀️ Bright Day Mode Activated!";
            }

            document.getElementById('weather-status').innerHTML = statusText;
        }

        updateThemeByTime();
    </script>
</body>
</html>
