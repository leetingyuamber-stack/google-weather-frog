<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Froggy's Cozy Life Tracker</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center;
            background: #233342; transition: background 1s ease;
        }
        .room-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* Permanent cozy background scenery elements to frame the live window */
        .window-frame {
            position: absolute; top: 12%; right: 15%; width: 150px; height: 180px;
            background: rgba(0, 0, 0, 0.2); border: 8px solid #5d4037; border-radius: 4px; z-index: 1;
        }
        .window-cross-v { position: absolute; left: 50%; width: 4px; height: 100%; background: #5d4037; transform: translateX(-50%); }
        .window-cross-h { position: absolute; top: 40%; width: 100%; height: 4px; background: #5d4037; }
        
        .study-desk {
            position: absolute; bottom: 8%; left: 10%; width: 260px; height: 120px;
            background: #8d6e63; border-radius: 8px 8px 0 0; box-shadow: 0 4px 10px rgba(0,0,0,0.15); z-index: 2;
        }

        .bed-setup {
            position: absolute; bottom: 8%; right: 10%; width: 420px; height: 160px;
            background: #7e57c2; border-radius: 16px 16px 0 0; box-shadow: 0 12px 24px rgba(0,0,0,0.2); z-index: 2;
        }
        .soft-pillow { position: absolute; top: -24px; left: 20px; width: 130px; height: 45px; background: #ffffff; border-radius: 12px; }
        .warm-blanket { position: absolute; bottom: 0; width: 100%; height: 110px; background: #e57373; border-radius: 8px 8px 0 0; z-index: 5; }

        /* --- THE DYNAMIC MOVING GIF ENGINE CANVAS --- */
        .frog-character {
            position: absolute; width: 250px; height: 250px;
            z-index: 4; transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
        }
        .pos-in-bed { bottom: 135px; left: calc(90% - 220px); }
        .pos-at-desk { bottom: 125px; left: 11%; }

        /* --- LIVE CALENDAR OVERLAY CARD --- */
        #status-card {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.96); padding: 16px 22px; border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 10; min-width: 220px;
        }
        #live-clock { font-size: 24px; font-weight: bold; color: #2C3E50; margin-bottom: 2px; }
        #live-date { font-size: 14px; font-weight: 600; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        #activity-text { font-size: 14px; color: #34495e; font-weight: 500; border-top: 1px solid #eee; padding-top: 8px; }
    </style>
</head>
<body>

    <div id="status-card">
        <div id="live-clock">00:00:00 AM</div>
        <div id="live-date">Loading Calendar...</div>
        <div id="activity-text">Syncing laptop...</div>
    </div>

    <div class="room-container">
        <div class="window-frame">
            <div class="window-cross-v"></div><div class="window-cross-h"></div>
        </div>

        <div class="study-desk"></div>
        <div class="bed-setup"><div class="soft-pillow"></div><div class="warm-blanket"></div></div>

        <!-- Clean, unbugged display anchor box -->
        <div id="frog-actor" class="frog-character"></div>
    </div>
    <script>
        function runScheduleTracker() {
            const time = new Date();
            
            // Sync calendar display card details
            const optionsDate = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('live-date').innerHTML = time.toLocaleDateString('en-US', optionsDate);
            document.getElementById('live-clock').innerHTML = time.toLocaleTimeString('en-US', { hour12: true });

            const mins = (time.getHours() * 60) + time.getMinutes();
            let txt = "";
            let mode = "sleep"; 

            // --- DEPLOYING UNBLOCKABLE DYNAMIC SOURCE LOOPS ---
            const ANIMATED_FROGS = {
                sunny_study: "https://gstatic.com",
                rainy_cozy: "https://gstatic.com"
            };

            if (mins >= 360 && mins < 480) {          // 6:00 AM - 7:59 AM
                txt = "🌅 Waking up and stretching... Good morning!";
                mode = "bed-awake";
            } else if (mins >= 480 && mins < 510) {   // 8:00 AM - 8:29 AM
                txt = "🥞 Breakfast hour! MUNCHING on warm pancakes!";
                mode = "work";
            } else if (mins >= 510 && mins < 780) {   // 8:30 AM - 12:59 PM
                txt = "📚 Working hard at school! Focus mode active.";
                mode = "work";
            } else if (mins >= 780 && mins < 840) {   // 1:00 PM - 1:59 PM
                txt = "🥪 Lunch break! Eating a fresh school sandwich.";
                mode = "work";
            } else if (mins >= 840 && mins < 900) {   // 2:00 PM - 2:59 PM
                txt = "🚌 Riding the transit bus home! Beep beep.";
                mode = "work";
            } else if (mins >= 900 && mins < 960) {   // 3:00 PM - 3:59 PM
                txt = "🐸 Free time! Winding down inside the room.";
                mode = "work";
            } else if (mins >= 960 && mins < 1110) {  // 4:00 PM - 6:29 PM
                txt = "✍️ Homework time! Cranking out assignments.";
                mode = "work";
            } else if (mins >= 1110 && mins < 1140) { // 6:30 PM - 6:59 PM
                txt = "🍲 Dinner time! Sipping a hot bowl of soup.";
                mode = "work";
            } else if (mins >= 1140 && mins < 1260) { // 7:00 PM - 8:59 PM
                txt = "🎨 Drawing sketches and unwinding...";
                mode = "work";
            } else {                                  // 9:00 PM - 5:59 AM
                txt = "💤 Shhh... Froggy is fast asleep. Goodnight!";
                mode = "sleep";
            }

            const actor = document.getElementById('frog-actor');
            const win = document.querySelector('.window-frame');

            // Reset basic placement structures
            actor.className = "frog-character";

            // Automatically load clear day loops or shelter home loops based on mode
            if (mode === "sleep" || mins >= 1110) {
                actor.style.backgroundImage = `url('${ANIMATED_FROGS.rainy_cozy}')`;
            } else {
                actor.style.backgroundImage = `url('${ANIMATED_FROGS.sunny_study}')`;
            }

            if (mode === "sleep") {
                document.body.style.background = "#233342"; 
                win.style.background = "rgba(0,0,0,0.6)";
                actor.classList.add("pos-in-bed");
            } 
            else if (mode === "bed-awake") {
                document.body.style.background = "#fff176"; 
                win.style.background = "#e0f7fa"; 
                actor.classList.add("pos-in-bed");
            } 
            else if (mode === "work") {
                document.body.style.background = "#AED6F1"; 
                win.style.background = "#e0f7fa"; 
                actor.classList.add("pos-at-desk");
            }

            document.getElementById('activity-text').innerHTML = txt;
        }

        runScheduleTracker();
        setInterval(runScheduleTracker, 1000); // 1-second clock ticks
    </script>
</body>
</html>
