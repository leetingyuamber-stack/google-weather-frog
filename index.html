<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animated Weather Frog</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #frog-background {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 1s ease-in-out;
        }
        #info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            padding: 15px;
            border-radius: 12px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div id="info-box">
        <h3 style="margin: 0 0 5px 0;">Froggy's Weather</h3>
        <div id="weather-status">Loading live weather...</div>
    </div>

    <div id="frog-background"></div>

    <script>
        // 1. SET YOUR LOCATION HERE (Change to your city if needed)
        const CITY = "Bishan"; 
        const LAT = 1.3508;  // Latitude for Bishan
        const LON = 103.8481; // Longitude for Bishan

        // 2. PASTE YOUR FAVORITE MOVING GIF LINKS HERE
        const FROG_GIFS = {
            sunny: "https://giphy.com", // Change to a sunny frog GIF
            rainy: "https://giphy.com", // Change to a rainy frog GIF
            cloudy: "https://giphy.com", // Change to a cloudy frog GIF
            default: "https://giphy.com"
        };

        // 3. THIS FUNCTION FETCHES LIVE WEATHER FROM OPEN-METEO (Free & School-Safe)
        async function updateWeatherFrog() {
            try {
                const response = await fetch(`https://open-meteo.com{LAT}&longitude=${LON}&current_weather=true`);
                const data = await response.json();
                const weatherCode = data.current_weather.weathercode;
                const temp = data.current_weather.temperature;

                let condition = "sunny";
                let statusText = `☀️ It is currently ${temp}°C and Sunny!`;

                // Open-Meteo weather codes (e.g., 51-67 are rain, 1-3 are cloudy)
                if (weatherCode >= 51 && weatherCode <= 82) {
                    condition = "rainy";
                    statusText = `🌧️ It is currently ${temp}°C and Raining!`;
                } else if (weatherCode >= 1 && weatherCode <= 3) {
                    condition = "cloudy";
                    statusText = `☁️ It is currently ${temp}°C and Cloudy!`;
                }

                // Update the text box
                document.getElementById('weather-status').innerHTML = statusText;
                
                // Update the background to the correct moving GIF!
                document.getElementById('frog-background').style.backgroundImage = `url('${FROG_GIFS[condition]}')`;

            } catch (error) {
                document.getElementById('weather-status').innerHTML = "🐸 Froggy couldn't reach the weather satellite!";
                document.getElementById('frog-background').style.backgroundImage = `url('${FROG_GIFS.default}')`;
            }
        }

        // Run instantly when page loads
        updateWeatherFrog();
    </script>
</body>
</html>
